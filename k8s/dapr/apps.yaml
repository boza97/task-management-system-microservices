apiVersion: v1
kind: Secret
metadata:
  name: tms-secrets
  namespace: tms
type: Opaque
stringData:
  jwt-secret: "change-me-super-secret-jwt-key-for-tms-thesis-0123456789"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: tms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "user-service"
        dapr.io/app-port: "8081"
    spec:
      containers:
        - name: user-service
          image: localhost:5000/tms/user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: dapr
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://user-db:5432/user_db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tms-secrets
                  key: jwt-secret
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: tms
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
---
