apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: tms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost:5000/tms/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: PROJECT_SERVICE_URL
              value: http://project-service:8082
            - name: TASK_SERVICE_URL
              value: http://task-service:8083
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service:8084
            - name: AUDIT_SERVICE_URL
              value: http://audit-service:8085
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: tms
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
