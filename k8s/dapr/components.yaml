apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: task-pubsub
  namespace: tms
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka:19092"
    - name: authType
      value: "none"
    - name: initialOffset
      value: "oldest"
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: task-events-subscription
  namespace: tms
spec:
  pubsubname: task-pubsub
  topic: task-events
  routes:
    default: /events/task-events
scopes:
  - notification-service
  - audit-service
---
apiVersion: dapr.io/v1alpha1
kind: Resiliency
metadata:
  name: tms-resiliency
  namespace: tms
spec:
  policies:
    timeouts:
      general: 3s
    retries:
      serviceRetry:
        policy: exponential
        maxInterval: 5s
        maxRetries: 3
    circuitBreakers:
      serviceCB:
        maxRequests: 1
        interval: 10s
        timeout: 10s
        trip: consecutiveFailures > 5
  targets:
    apps:
      user-service:
        timeout: general
        retry: serviceRetry
        circuitBreaker: serviceCB
      project-service:
        timeout: general
        retry: serviceRetry
        circuitBreaker: serviceCB
      task-service:
        timeout: general
        retry: serviceRetry
        circuitBreaker: serviceCB
