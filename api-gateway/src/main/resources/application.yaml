server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/tasks/*/audit-logs

            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/tasks/**,/api/task-statuses/**

            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/projects/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/notifications/**

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**,/api/auth/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200}"
                allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowedHeaders: "*"
                allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
