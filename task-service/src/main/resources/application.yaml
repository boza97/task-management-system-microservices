server:
  port: 8083

spring:
  application:
    name: task-service

  datasource:
    url: jdbc:postgresql://localhost:5435/task_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:#@!#assaD!@@#!@$SAD@$!%@!%@Ss$#!@$@$FASFQ@QFSAFASF_CHANGE_ME}

services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
    app-id: ${USER_SERVICE_APP_ID:user-service}
  project-service:
    url: ${PROJECT_SERVICE_URL:http://localhost:8082}
    app-id: ${PROJECT_SERVICE_APP_ID:project-service}

dapr:
  pubsub:
    name: ${DAPR_PUBSUB_NAME:task-pubsub}

app:
  kafka:
    topics:
      task-events: task-events
