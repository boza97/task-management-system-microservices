databaseChangeLog:

  - changeSet:
      id: 000-enable-uuid-extension
      author: bozidar
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  - changeSet:
      id: 001-create-task-status
      author: bozidar
      changes:
        - createTable:
            tableName: task_status
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-tasks
      author: bozidar
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: priority
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: due_date
                  type: date
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: status_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: assignee_id
                  type: uuid
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: status_id
            referencedTableName: task_status
            referencedColumnNames: id
            constraintName: fk_tasks_status

        - createIndex:
            tableName: tasks
            indexName: idx_tasks_project_id
            columns:
              - column:
                  name: project_id

        - createIndex:
            tableName: tasks
            indexName: idx_tasks_assignee_id
            columns:
              - column:
                  name: assignee_id

  - changeSet:
      id: 003-create-comments
      author: bozidar
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: content
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: task_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: uuid
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_comments_task
            onDelete: CASCADE

        - createIndex:
            tableName: comments
            indexName: idx_comments_task_id
            columns:
              - column:
                  name: task_id
