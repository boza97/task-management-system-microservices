databaseChangeLog:

  - changeSet:
      id: 000-enable-uuid-extension
      author: bozidar
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  - changeSet:
      id: 001-create-audit-logs
      author: bozidar
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: project_id
                  type: uuid
              - column:
                  name: action_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: old_value
                  type: text
              - column:
                  name: new_value
                  type: text
              - column:
                  name: performed_by_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: performed_by_name
                  type: varchar(255)

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_task_id
            columns:
              - column:
                  name: task_id
