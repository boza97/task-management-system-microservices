databaseChangeLog:

  - changeSet:
      id: 000-enable-uuid-extension
      author: bozidar
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            stripComments: true
            sql: |
              CREATE EXTENSION IF NOT EXISTS "pgcrypto";

  - changeSet:
      id: 001-create-projects
      author: bozidar
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_key
                  type: varchar(10)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(1000)
              - column:
                  name: owner_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - createIndex:
            tableName: projects
            indexName: idx_projects_owner_id
            columns:
              - column:
                  name: owner_id

  - changeSet:
      id: 002-create-project-memberships
      author: bozidar
      changes:
        - createTable:
            tableName: project_memberships
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: timestamptz
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: project_memberships
            columnNames: project_id, user_id
            constraintName: uq_project_memberships_project_user

        - addForeignKeyConstraint:
            baseTableName: project_memberships
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_project_memberships_project
            onDelete: CASCADE

        - createIndex:
            tableName: project_memberships
            indexName: idx_project_memberships_user_id
            columns:
              - column:
                  name: user_id
